<div id="overture" hidden aria-hidden="true">
  <div class="ov-inner">
    <svg class="ov-dial" viewBox="0 0 240 240" fill="none" aria-hidden="true">
      <g class="ov-ticks" stroke="var(--gold)" stroke-width="1">
        <line x1="120" y1="6"   x2="120" y2="18"/><line x1="120" y1="222" x2="120" y2="234"/>
        <line x1="6"   y1="120" x2="18"  y2="120"/><line x1="222" y1="120" x2="234" y2="120"/>
        <line x1="39"  y1="39"  x2="47"  y2="47"/><line x1="193" y1="193" x2="201" y2="201"/>
        <line x1="201" y1="39"  x2="193" y2="47"/><line x1="47"  y1="193" x2="39"  y2="201"/>
      </g>
      <circle class="ov-ring" cx="120" cy="120" r="104" stroke="var(--gold)" stroke-width="1"/>
      <circle class="ov-ring-inner" cx="120" cy="120" r="86" stroke="rgba(185,149,82,.35)" stroke-width="1"/>
      <g class="ov-spokes" stroke="rgba(185,149,82,.5)" stroke-width="1">
        <line x1="120" y1="34" x2="120" y2="66"/><line x1="120" y1="174" x2="120" y2="206"/>
        <line x1="34" y1="120" x2="66" y2="120"/><line x1="174" y1="120" x2="206" y2="120"/>
      </g>
      <circle class="ov-hub" cx="120" cy="120" r="7" fill="var(--gold)"/>
    </svg>

    <p class="ov-word">Bullion</p>
    <p class="ov-sub">Bredgade 33 · København K</p>
  </div>
  <button type="button" class="ov-skip" aria-label="Spring introen over">Spring over</button>
</div>

<script>
/* Overture runtime: once per session, skippable, never under reduced motion. */
(function () {
  var ov = document.getElementById('overture');
  if (!ov) { return; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen = false;
  try { seen = sessionStorage.getItem('bullion-overture') === '1'; } catch (e) {}
  var supports = window.CSS && CSS.supports && CSS.supports('clip-path', 'circle(50% at 50% 50%)');

  var remove = function () {
    document.body.classList.remove('ov-running');
    if (ov.parentNode) { ov.parentNode.removeChild(ov); }
    document.removeEventListener('keydown', onKey);
  };
  var onKey = function (e) { if (e.key === 'Escape') { open(); } };
  var opening = false;
  var open = function () {
    if (opening) { return; }
    opening = true;
    ov.classList.add('is-open');
    setTimeout(remove, 1600);
  };

  if (reduce || seen || !supports) { remove(); return; }
  try { sessionStorage.setItem('bullion-overture', '1'); } catch (e) {}

  document.body.classList.add('ov-running');
  ov.hidden = false;
  ov.querySelector('.ov-skip').addEventListener('click', open);
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', function (e) { if (e.target === ov) { open(); } });
  setTimeout(open, 3600);
  setTimeout(remove, 3600 + 2400); /* safety net */
})();
</script>
