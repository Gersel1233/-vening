<script>
/* Shared runtime for Revision 2: scroll reveals, glass specular tracking. Pieces own their own scripts. */
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Reveals. Threshold 0, because a .reveal-wipe element is clipped to nothing at rest and a
     tall one can never report a ratio; entering the viewport at all is the whole signal.
     Held until the overture has opened, so nothing plays out behind the curtain. */
  var started = false;
  var startReveals = function () {
    if (started) { return; }
    started = true;
    var els = document.querySelectorAll('.reveal');
    if (reduce || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(els, function (e) { e.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
    Array.prototype.forEach.call(els, function (e) { io.observe(e); });
  };
  if (document.body.classList.contains('ov-running')) {
    document.addEventListener('bullion:open', startReveals);
    setTimeout(startReveals, 7000); /* safety net if the overture never reports */
  } else {
    startReveals();
  }

  /* Gold hairline tracking scroll depth */
  if (!reduce) {
    var line = document.createElement('div');
    line.id = 'scrollline';
    document.body.appendChild(line);
    var ticking = false;
    var draw = function () {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
      line.style.transform = 'scaleX(' + p.toFixed(4) + ')';
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(draw); }
    }, { passive: true });
    draw();
  }

  /* Glass specular follows the pointer within each glass element */
  if (!reduce && window.matchMedia('(hover: hover)').matches) {
    document.addEventListener('pointermove', function (ev) {
      var t = ev.target.closest ? ev.target.closest('.glass') : null;
      if (!t) { return; }
      var r = t.getBoundingClientRect();
      t.style.setProperty('--mx', ((ev.clientX - r.left) / r.width * 100).toFixed(1) + '%');
      t.style.setProperty('--my', ((ev.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    }, { passive: true });
  }
})();
</script>
